<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2800" viewBox="0 0 390 2800">
  <defs><style>.bg{fill:#fbfaf8}.paper{fill:#f4f1ed}.ink{fill:#131313}.lilac{fill:#8b5a89}.yellow{fill:#f6ca56}.blue{fill:#438fd4}.serif{font-family:Georgia,'Times New Roman',serif}.sans{font-family:Arial,Helvetica,sans-serif}.eyebrow{font:700 11px Arial;letter-spacing:2px;fill:#8b5a89}.body{font:400 14px Arial;fill:#4d4945}.nav{font:700 10px Arial;letter-spacing:1.5px}.big{font:700 50px Georgia}.h2{font:700 42px Georgia}.h3{font:700 24px Georgia}</style></defs>
  <rect class="bg" width="390" height="2800"/>
  <g transform="translate(24 28)"><text class="serif ink" font-size="24" font-weight="700" x="0" y="16">BP</text><text class="nav ink" x="168" y="14">WORK</text><text class="nav ink" x="225" y="14">ABOUT</text><text class="nav ink" x="285" y="14">LINKEDIN</text></g>
  <g transform="translate(24 140)"><text class="eyebrow" x="0" y="0">BRYAN PAN · SEATTLE, WA</text><text class="big ink" x="0" y="70">I build</text><text class="big ink" x="0" y="120">thoughtful</text><text class="big ink" x="0" y="170">software with</text><text class="big ink" x="0" y="220">a little magic.</text><text class="body" x="0" y="278">I’m a software engineer who loves building for</text><text class="body" x="0" y="302">other people and turning ambiguous ideas into</text><text class="body" x="0" y="326">calm, useful product experiences.</text><rect x="0" y="365" width="118" height="36" fill="none" stroke="#131313"/><text class="nav ink" x="22" y="388">VIEW WORK</text></g>
  <g transform="translate(24 600)"><rect width="342" height="420" class="paper" stroke="#131313" stroke-opacity=".12"/><circle cx="286" cy="56" r="32" class="yellow"/><rect x="232" y="264" width="80" height="80" class="blue"/><ellipse cx="170" cy="155" rx="78" ry="95" fill="#d6c5b2"/><circle cx="170" cy="100" r="52" fill="#c89f78"/><path d="M98 205 Q170 150 242 205 L265 290 L75 290 Z" fill="#6f5c46"/><line x1="34" x2="308" y1="330" y2="330" stroke="#131313" stroke-opacity=".12"/><text class="eyebrow" x="34" y="358">CURRENTLY</text><text class="sans ink" font-size="18" font-weight="700" x="34" y="386">Building human-centered software</text><text class="sans ink" font-size="18" font-weight="700" x="34" y="410">across product and web.</text></g>
  <g transform="translate(24 1090)"><rect width="342" height="126" class="bg" stroke="#131313" stroke-opacity=".12"/><rect x="24" y="24" width="22" height="22" class="lilac"/><text class="nav ink" x="24" y="85">PRODUCT-MINDED ENGINEERING</text><g transform="translate(0 126)"><rect width="342" height="126" class="bg" stroke="#131313" stroke-opacity=".12"/><circle cx="35" cy="35" r="13" class="yellow"/><text class="nav ink" x="24" y="85">DESIGN SYSTEMS &amp; POLISHED INTERFACES</text></g><g transform="translate(0 252)"><rect width="342" height="126" class="bg" stroke="#131313" stroke-opacity=".12"/><rect x="24" y="24" width="22" height="22" class="blue"/><text class="nav ink" x="24" y="85">PROTOTYPING, SHIPPING, AND ITERATION</text></g></g>
  <g transform="translate(24 1600)"><text class="eyebrow" x="0" y="0">WORK</text><text class="h2 ink" x="0" y="58">Sorcery</text><text class="h2 ink" x="0" y="105">performed in</text><text class="h2 ink" x="0" y="152">real life.</text><text class="body" x="0" y="205">Professional outcomes, polished systems,</text><text class="body" x="0" y="229">and interfaces with a point of view.</text><g transform="translate(0 300)"><rect width="342" height="430" class="bg" stroke="#131313" stroke-opacity=".12"/><text class="eyebrow" x="28" y="52">EXPERIENCE</text><text class="h3 ink" x="28" y="92">Reality Labs product</text><text class="h3 ink" x="28" y="122">engineering</text><text class="body" x="28" y="162">Software craft in a research-heavy</text><text class="body" x="28" y="184">product environment.</text><rect x="28" y="230" width="286" height="160" class="lilac"/></g><g transform="translate(0 770)"><rect width="342" height="430" class="bg" stroke="#131313" stroke-opacity=".12"/><text class="eyebrow" x="28" y="52">BRAND &amp; WEB</text><text class="h3 ink" x="28" y="92">Portfolio design</text><text class="h3 ink" x="28" y="122">system</text><text class="body" x="28" y="162">Reusable typography, color, layout,</text><text class="body" x="28" y="184">and component patterns.</text><rect x="28" y="230" width="286" height="160" class="yellow"/></g></g>
</svg>
