<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2100" viewBox="0 0 390 2100">
  <defs><style>.bg{fill:#fbfaf8}.paper{fill:#f4f1ed}.ink{fill:#131313}.lilac{fill:#8b5a89}.yellow{fill:#f6ca56}.blue{fill:#438fd4}.serif{font-family:Georgia,'Times New Roman',serif}.sans{font-family:Arial,Helvetica,sans-serif}.eyebrow{font:700 11px Arial;letter-spacing:2px;fill:#8b5a89}.body{font:400 14px Arial;fill:#4d4945}.nav{font:700 10px Arial;letter-spacing:1.5px}.big{font:700 50px Georgia}.h2{font:700 42px Georgia}.h3{font:700 22px Arial}</style></defs>
  <rect class="bg" width="390" height="2100"/>
  <g transform="translate(24 28)"><text class="serif ink" font-size="24" font-weight="700" x="0" y="16">BP</text><text class="nav ink" x="168" y="14">WORK</text><text class="nav ink" x="225" y="14">ABOUT</text><text class="nav ink" x="285" y="14">LINKEDIN</text></g>
  <g transform="translate(24 160)"><text class="eyebrow" x="0" y="0">ABOUT</text><text class="big ink" x="0" y="70">Hi, I’m</text><text class="big ink" x="0" y="120">Bryan</text><text class="big ink" x="0" y="170">[潘博瑞]</text><text class="body" x="0" y="232">I’m a Seattle-based software engineer with</text><text class="body" x="0" y="256">experience in product environments like Meta</text><text class="body" x="0" y="280">Reality Labs and a UCLA foundation.</text></g>
  <g transform="translate(24 560)"><text class="eyebrow" x="0" y="0">SKILLS</text><text class="h2 ink" x="0" y="60">My magical</text><text class="h2 ink" x="0" y="108">abilities.</text><g transform="translate(0 170)"><rect width="342" height="90" class="bg" stroke="#131313" stroke-opacity=".12"/><text class="nav ink" x="24" y="54">FRONTEND ARCHITECTURE</text><g transform="translate(0 90)"><rect width="342" height="90" class="bg" stroke="#131313" stroke-opacity=".12"/><text class="nav ink" x="24" y="54">PRODUCT ENGINEERING</text></g><g transform="translate(0 180)"><rect width="342" height="90" class="bg" stroke="#131313" stroke-opacity=".12"/><text class="nav ink" x="24" y="54">DESIGN SYSTEMS</text></g><g transform="translate(0 270)"><rect width="342" height="90" class="bg" stroke="#131313" stroke-opacity=".12"/><text class="nav ink" x="24" y="54">RAPID PROTOTYPING</text></g><g transform="translate(0 360)"><rect width="342" height="90" class="bg" stroke="#131313" stroke-opacity=".12"/><text class="nav ink" x="24" y="54">CROSS-FUNCTIONAL COLLABORATION</text></g><g transform="translate(0 450)"><rect width="342" height="90" class="bg" stroke="#131313" stroke-opacity=".12"/><text class="nav ink" x="24" y="54">USER-CENTERED POLISH</text></g></g></g>
  <g transform="translate(24 1350)"><rect width="342" height="210" class="paper" stroke="#131313" stroke-opacity=".12"/><rect x="28" y="28" width="24" height="24" class="lilac"/><text class="h3 ink" x="28" y="95">Make it useful</text><text class="body" x="28" y="138">Start with the human problem and</text><text class="body" x="28" y="162">build the smallest thing of value.</text><g transform="translate(0 238)"><rect width="342" height="210" class="paper" stroke="#131313" stroke-opacity=".12"/><circle cx="40" cy="40" r="14" class="yellow"/><text class="h3 ink" x="28" y="95">Make it beautiful</text><text class="body" x="28" y="138">Use typography, hierarchy, and</text><text class="body" x="28" y="162">restraint so software feels calm.</text></g><g transform="translate(0 476)"><rect width="342" height="210" class="paper" stroke="#131313" stroke-opacity=".12"/><rect x="28" y="28" width="24" height="24" class="blue"/><text class="h3 ink" x="28" y="95">Make it shippable</text><text class="body" x="28" y="138">Balance craft with pragmatic</text><text class="body" x="28" y="162">engineering and reliability.</text></g></g>
</svg>
