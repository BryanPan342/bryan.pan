<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1900" viewBox="0 0 1440 1900">
  <defs><style>.bg{fill:#fbfaf8}.paper{fill:#f4f1ed}.ink{fill:#131313}.muted{fill:#6b6660}.lilac{fill:#8b5a89}.yellow{fill:#f6ca56}.blue{fill:#438fd4}.serif{font-family:Georgia,'Times New Roman',serif}.sans{font-family:Arial,Helvetica,sans-serif}.eyebrow{font:700 14px Arial;letter-spacing:3px;fill:#8b5a89}.body{font:400 18px Arial;fill:#4d4945}.nav{font:700 13px Arial;letter-spacing:2px}.big{font:700 96px Georgia}.h2{font:700 64px Georgia}.h3{font:700 30px Arial}</style></defs>
  <rect class="bg" width="1440" height="1900"/>
  <g transform="translate(120 42)"><text class="serif ink" font-size="32" font-weight="700" x="0" y="18">BP</text><text class="nav ink" x="735" y="18">WORK</text><text class="nav ink" x="815" y="18">ABOUT</text><text class="nav ink" x="910" y="18">LINKEDIN</text><rect x="1030" y="-18" width="210" height="38" fill="none" stroke="#131313"/><text class="nav ink" x="1050" y="7">LET’S WORK TOGETHER</text></g>
  <g transform="translate(120 260)"><text class="eyebrow" x="0" y="0">ABOUT</text><text class="big ink" x="0" y="120">Hi, I’m Bryan</text><text class="big ink" x="0" y="215">[潘博瑞]</text><text class="body" x="0" y="295">I’m a Seattle-based software engineer with experience in product environments like Meta Reality Labs</text><text class="body" x="0" y="327">and a UCLA foundation. I love building software for others, meeting new people, and drinking coffee.</text></g>
  <g transform="translate(120 760)"><text class="eyebrow" x="0" y="0">SKILLS</text><text class="h2 ink" x="0" y="85">My magical</text><text class="h2 ink" x="0" y="150">abilities.</text><g transform="translate(520 -40)"><rect width="680" height="360" fill="#131313" opacity=".08"/><g fill="#fbfaf8" stroke="#131313" stroke-opacity=".12"><rect x="1" y="1" width="338" height="118"/><rect x="341" y="1" width="338" height="118"/><rect x="1" y="121" width="338" height="118"/><rect x="341" y="121" width="338" height="118"/><rect x="1" y="241" width="338" height="118"/><rect x="341" y="241" width="338" height="118"/></g><g class="nav ink"><text x="30" y="68">FRONTEND ARCHITECTURE</text><text x="370" y="68">PRODUCT ENGINEERING</text><text x="30" y="188">DESIGN SYSTEMS</text><text x="370" y="188">RAPID PROTOTYPING</text><text x="30" y="308">CROSS-FUNCTIONAL COLLABORATION</text><text x="370" y="308">USER-CENTERED POLISH</text></g></g></g>
  <g transform="translate(120 1285)"><g><rect width="370" height="300" class="paper" stroke="#131313" stroke-opacity=".12"/><rect x="40" y="40" width="28" height="28" class="lilac"/><text class="h3 ink" x="40" y="130">Make it useful</text><text class="body" x="40" y="180">Start with the human problem,</text><text class="body" x="40" y="210">reduce ambiguity, and prove value.</text></g><g transform="translate(415 0)"><rect width="370" height="300" class="paper" stroke="#131313" stroke-opacity=".12"/><circle cx="54" cy="54" r="16" class="yellow"/><text class="h3 ink" x="40" y="130">Make it beautiful</text><text class="body" x="40" y="180">Use typography, hierarchy, and</text><text class="body" x="40" y="210">restraint so software feels calm.</text></g><g transform="translate(830 0)"><rect width="370" height="300" class="paper" stroke="#131313" stroke-opacity=".12"/><rect x="40" y="40" width="28" height="28" class="blue"/><text class="h3 ink" x="40" y="130">Make it shippable</text><text class="body" x="40" y="180">Balance craft with pragmatic</text><text class="body" x="40" y="210">engineering to become reliable.</text></g></g>
</svg>
